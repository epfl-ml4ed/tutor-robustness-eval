# Training configuration for SFT on conversation data

# Model configuration
model:
  model_name:   # Change to your model
  tokenizer_name: null  # Uses model_name if not specified
  use_flash_attention: false

# Data configuration
data:
  data_path:   # Path to training data
  split: 
  val_data_path: null  # Optional validation data path
  max_length: 8192

# Training configuration
training:
  output_dir: "./outputs/sft_model"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 100
  logging_steps: 10
  save_steps: 1
  eval_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: false
  seed: 42

# LoRA configuration
lora:
  use_lora: false
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Weights & Biases configuration
wandb:
  wandb_project:   # Set to enable W&B logging
  wandb_run_name:  # Optional run name

# HuggingFace Hub configuration
hf_hub:
  push_to_hub: false  # Set to true to push model to HuggingFace Hub
  hub_model_id: null  # e.g., "username/model-name"
  hub_private: false  # Set to true for private model repositories
  merge_adapters: true  # If true, merges LoRA adapters before pushing; if false, pushes adapters only
