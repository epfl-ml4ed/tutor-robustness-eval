# ================================
# Parallel Evaluation Configuration - Prompt Generator Mode
# ================================

# Dataset configuration
dataset:
  name: "gsm8k"
  path: "dataset/gsm8k_test.json"
  split: "train"
  start_idx: 0
  end_idx: 240

# Evaluation settings
evaluation:
  max_turns: 20
  max_concurrent_problems: 120
  batch_size: 120
  output_dir: "evaluation_output"
  strategies: [direct_request]
  
# Attacker configuration
attacker:
  type: "prompt_generator"  # or "manual_prompts"
  random_order: true

tutor:
  type: ""
  
# Agent configuration with vLLM ports
agent:
  # ================================
  # 🧑‍🏫 Tutor Agent
  # ================================
  tutor:
    model_name: "Qwen/Qwen2.5-7B-Instruct"
    use_vllm: true
    vllm_port: 8000
    base_url: "http://localhost:8000/v1"
    device: "cuda:0"
    prompt_file: "src/configs/prompt/tutor/default.txt"
    response_format: None
    temperature: 0.7
    max_new_tokens: 2048

  # ================================
  # ⚖️ Judge Agent
  # ================================
  judge:
    model_name: "meta-llama/Llama-3.3-70B-Instruct-bfloat16"
    use_vllm: true
    vllm_port: 8000
    base_url: ""
    device: "cuda:2"
    to_tutor_prompt_file: "src/configs/prompt/judge/tutor_refined.txt"
    to_student_prompt_file: "src/configs/prompt/judge/student_refined.txt"
    temperature: 0
    max_new_tokens: 2048

  # ================================
  # ✍️ Prompt Generator Agent
  # ================================
  prompt_generator:
    model_name: "Qwen/Qwen2.5-7B-Instruct"
    use_vllm: true  # Using OpenAI API
    vllm_port: 8000
    base_url: "http://localhost:8000/v1"
    device: "cuda:0"
    existing_prompts_path: "collected_prompts/direct_request_manually_refined.json"
    prompt_file: "collected_prompts/direct_request_manually_refined.json"
    prompt_number: 20
    temperature: 0.7
    max_new_tokens: 4096

  # Not used in prompt_generator mode
  student:
    model_name: "Qwen/Qwen2.5-7B-Instruct"
    use_vllm: false
    vllm_port: 8000
    base_url: "http://localhost:8000/v1"
    device: "cuda:1"
    prompt_file: "src/configs/prompt/student/visualize_reasoning.txt"
    temperature: 0.1
    max_new_tokens: 2048

  reflector:
    student_model_name: "Qwen/Qwen2.5-7B-Instruct"
    student_use_vllm: true
    student_vllm_port: 8000
    student_base_url: "http://localhost:8000/v1"
    tutor_model_name: "Qwen/Qwen2.5-7B-Instruct"
    tutor_use_vllm: true
    tutor_vllm_port: 8000
    tutor_base_url: "http://localhost:8000/v1"
    device: "cuda:0"
    to_tutor_prompt_file: "src/configs/prompt/reflector/to_tutor.txt"
    to_student_prompt_file: "src/configs/prompt/reflector/to_student.txt"
    temperature: 0.7
    max_new_tokens: 2048

# Playground settings
playground:
  student_reflection: false
  tutor_reflection: false

# Logging
use_wandb: true
wandb:
  project:  # project name
  name:  # run name
